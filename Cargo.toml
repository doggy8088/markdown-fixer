[workspace]
resolver = "3"
members = ["crates/markdown-fixer", "crates/markdown-fixer-cli", "crates/markdown-fixer-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Will 保哥"]
repository = "https://github.com/doggy8088/markdown-fixer"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
