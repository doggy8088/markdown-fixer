[package]
name = "markdown-fixer-ffi"
description = "C ABI shared/static library for markdown-fixer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "markdown_fixer_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
markdown-fixer = { path = "../markdown-fixer", version = "0.1.1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
