[package]
name = "markdown-fixer"
description = "Safe, line-oriented Markdown syntax checker and auto-corrector (Rust port of the markdown-autocorrect skill)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
exclude = ["tests/"]
homepage = "https://github.com/doggy8088/markdown-fixer"
documentation = "https://docs.rs/markdown-fixer"
keywords = ["markdown", "lint", "formatter", "cjk"]
categories = ["text-processing"]

[features]
default = []
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
proptest = { version = "1.6", default-features = false, features = ["std"] }
serde_json = "1"
