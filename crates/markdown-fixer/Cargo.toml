[package]
name = "markdown-fixer"
description = "Safe, line-oriented Markdown syntax checker and auto-corrector (Rust port of the markdown-autocorrect skill)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
exclude = ["tests/"]
homepage = "https://github.com/doggy8088/markdown-fixer"
documentation = "https://docs.rs/markdown-fixer"
keywords = ["markdown", "lint", "formatter", "cjk"]
categories = ["text-processing"]

[features]
default = ["render-guard"]
serde = ["dep:serde"]
# 渲染保護（PRD 6.9）：以 pulldown-cmark 渲染比對，擋下會意外改變渲染結果的修正。
render-guard = ["dep:pulldown-cmark"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"], optional = true }

[dev-dependencies]
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
proptest = { version = "1.6", default-features = false, features = ["std"] }
serde_json = "1"
