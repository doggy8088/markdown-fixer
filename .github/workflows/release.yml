name: Release

# 推送 vX.Y.Z tag 時，為 PRD〈2.1 G2〉列出的每個平台建置 CLI 與 C ABI 函式庫，
# 連同 checksum 附加到 GitHub Release。流程說明見 docs/release.md。

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Check the tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Compare tag and workspace version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "tag=$tag cargo=$cargo_version"
          [ "$tag" = "$cargo_version" ] || {
            echo "::error::Version mismatch: tag=$tag Cargo.toml=$cargo_version"
            exit 1
          }
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, musl: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build CLI and FFI library
        run: cargo build --release --locked --target ${{ matrix.target }} -p markdown-fixer-cli -p markdown-fixer-ffi
      - name: Smoke test
        shell: bash
        run: |
          # 交叉編譯（例如在 arm64 runner 上建置 x86_64-apple-darwin）時不執行。
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$host" != "$TARGET" ]; then
            echo "::notice::skip smoke test: host $host cannot run $TARGET"
            exit 0
          fi
          bin=target/$TARGET/release/markdown-fixer
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --version
          printf '#Title\n' | "$bin" --stdin --write --quiet --exit-zero
      - name: Package
        shell: bash
        run: |
          out=target/$TARGET/release
          cli="markdown-fixer-$VERSION-$TARGET"
          ffi="markdown-fixer-ffi-$VERSION-$TARGET"
          mkdir -p "dist" "stage/$cli" "stage/$ffi/include" "stage/$ffi/lib"
          for f in README.md LICENSE; do
            if [ -f "$f" ]; then cp "$f" "stage/$cli/" "stage/$ffi/"; fi
          done
          cp crates/markdown-fixer-ffi/include/markdown_fixer.h "stage/$ffi/include/"
          case "$TARGET" in
            *windows*)
              cp "$out/markdown-fixer.exe" "stage/$cli/"
              # markdown_fixer_ffi.dll + 匯入程式庫 .dll.lib；靜態程式庫是 .lib。
              cp "$out/markdown_fixer_ffi.dll" "$out/markdown_fixer_ffi.dll.lib" "$out/markdown_fixer_ffi.lib" "stage/$ffi/lib/"
              (cd stage && 7z a -tzip "../dist/$cli.zip" "$cli" >/dev/null && 7z a -tzip "../dist/$ffi.zip" "$ffi" >/dev/null)
              ;;
            *)
              cp "$out/markdown-fixer" "stage/$cli/"
              cp "$out/libmarkdown_fixer_ffi.a" "stage/$ffi/lib/"
              # musl 預設 crt-static，rustc 不產生 cdylib；只提供 staticlib。
              for lib in libmarkdown_fixer_ffi.dylib libmarkdown_fixer_ffi.so; do
                if [ -f "$out/$lib" ]; then cp "$out/$lib" "stage/$ffi/lib/"; fi
              done
              # 本機建置的 install name 是 CI 上的絕對路徑；改成 @rpath 才能隨處使用。
              if [ -f "stage/$ffi/lib/libmarkdown_fixer_ffi.dylib" ]; then
                install_name_tool -id @rpath/libmarkdown_fixer_ffi.dylib "stage/$ffi/lib/libmarkdown_fixer_ffi.dylib"
              fi
              tar -C stage -czf "dist/$cli.tar.gz" "$cli"
              tar -C stage -czf "dist/$ffi.tar.gz" "$ffi"
              ;;
          esac
          cd dist
          for f in *; do
            if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
          done
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Aggregate checksums
        run: |
          cd dist
          cat ./*.sha256 | sort -k2 > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
