name: Publish to crates.io

# 推送 vX.Y.Z tag 時，以 crates.io Trusted Publishing（GitHub OIDC）發佈
# markdown-fixer 與 markdown-fixer-cli，不使用長期 API token。
# crates.io 端的設定（每個 crate 各一筆 trusted publisher）見 docs/release.md。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: cargo publish (trusted publishing)
    runs-on: ubuntu-latest
    # 必須與 crates.io trusted publisher 設定的 environment 名稱一致。
    environment: release
    permissions:
      contents: read
      id-token: write # 以 OIDC 向 crates.io 換取短期 token
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Check the tag matches Cargo.toml
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "tag=$tag cargo=$cargo_version"
          [ "$tag" = "$cargo_version" ] || {
            echo "::error::Version mismatch: tag=$tag Cargo.toml=$cargo_version"
            exit 1
          }

      - name: Test before publishing
        run: cargo test --workspace --all-features --locked

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # 依相依順序逐一發佈：先 markdown-fixer，再 markdown-fixer-cli。已經在 crates.io 上的
      # 版本會跳過（例如第一版是用 API token 手動發佈，之後才設定 trusted publishing）。
      # markdown-fixer-ffi 設了 publish = false，不會上傳。
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          for crate in markdown-fixer markdown-fixer-cli; do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -A "markdown-fixer-release (https://github.com/doggy8088/markdown-fixer)" \
              "https://crates.io/api/v1/crates/$crate/$version")
            if [ "$status" = "200" ]; then
              echo "$crate $version is already on crates.io; skipping."
              continue
            fi
            cargo publish -p "$crate" --locked
          done
