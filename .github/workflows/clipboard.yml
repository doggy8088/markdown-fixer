name: Clipboard examples

# 在 GitHub-hosted runner 上以真正的剪貼簿執行 examples/ 裡的剪貼簿腳本。
# 驗證範圍與尚未涵蓋的部分見 docs/clipboard.md〈CI 驗證〉。

on:
  push:
    paths:
      - examples/**
      - crates/markdown-fixer-cli/**
      - .github/workflows/clipboard.yml
  pull_request:
    paths:
      - examples/**
      - crates/markdown-fixer-cli/**
      - .github/workflows/clipboard.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (X11 + Wayland)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install X11 and Wayland clipboard tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth xclip wl-clipboard sway
      - name: Build markdown-fixer
        run: cargo build -p markdown-fixer-cli --locked
      - name: X11 clipboard (Xvfb + xclip)
        timeout-minutes: 5
        env:
          MARKDOWN_FIXER_BIN: ${{ github.workspace }}/target/debug/markdown-fixer
        run: xvfb-run -a examples/linux/test-real-clipboard.sh x11
      - name: Negative control (X11 test must catch a fixer that changes nothing)
        timeout-minutes: 5
        run: |
          log="$RUNNER_TEMP/negative-x11.log"
          if MARKDOWN_FIXER_BIN=/bin/cat xvfb-run -a examples/linux/test-real-clipboard.sh x11 >"$log" 2>&1; then
            cat "$log"; echo "test-real-clipboard.sh passed with /bin/cat as the fixer"; exit 1
          fi
          grep -F 'FAIL [cjk-fixed]' "$log"
      - name: Wayland clipboard (headless sway + wl-clipboard)
        timeout-minutes: 5
        env:
          MARKDOWN_FIXER_BIN: ${{ github.workspace }}/target/debug/markdown-fixer
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          printf 'xwayland disable\n' >"$RUNNER_TEMP/sway.conf"
          WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 WLR_RENDERER=pixman \
            sway -c "$RUNNER_TEMP/sway.conf" >"$RUNNER_TEMP/sway.log" 2>&1 &
          sway_pid=$!
          for _ in $(seq 50); do
            socket=$(find "$XDG_RUNTIME_DIR" -maxdepth 1 -name 'wayland-*' -type s | head -n 1)
            [ -n "$socket" ] && break
            sleep 0.2
          done
          if [ -z "$socket" ]; then
            echo "sway did not start"; cat "$RUNNER_TEMP/sway.log"; exit 1
          fi
          export WAYLAND_DISPLAY=$(basename "$socket")
          echo "WAYLAND_DISPLAY=$WAYLAND_DISPLAY"
          status=0
          examples/linux/test-real-clipboard.sh wayland || status=$?
          kill "$sway_pid" 2>/dev/null || true
          [ "$status" -eq 0 ] || cat "$RUNNER_TEMP/sway.log"
          exit "$status"

  windows:
    name: Windows (AutoHotkey v2)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      AHK_VERSION: 2.0.31
      AHK_SHA256: ca1a595aca4528755d8d4cd7fed23d497a37bd9a0b6892072612d68dee1bd00a
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build markdown-fixer
        run: cargo build -p markdown-fixer-cli --locked
      - name: Install AutoHotkey (portable zip, pinned SHA-256)
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'ahk.zip'
          Invoke-WebRequest -Uri "https://github.com/AutoHotkey/AutoHotkey/releases/download/v$env:AHK_VERSION/AutoHotkey_$env:AHK_VERSION.zip" -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($hash -ne $env:AHK_SHA256) { throw "AutoHotkey checksum mismatch: $hash" }
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'ahk')
      - name: Real clipboard (Windows PowerShell 5.1)
        timeout-minutes: 5
        shell: powershell
        run: >-
          examples\windows\test-real-clipboard.ps1
          -AutoHotkey "$env:RUNNER_TEMP\ahk\AutoHotkey64.exe"
          -Fixer target\debug\markdown-fixer.exe
      - name: Negative control (test must catch a fixer that fails)
        timeout-minutes: 5
        shell: powershell
        run: |
          $log = & examples\windows\test-real-clipboard.ps1 -AutoHotkey "$env:RUNNER_TEMP\ahk\AutoHotkey64.exe" -Fixer "$env:SystemRoot\System32\findstr.exe" *>&1 | Out-String
          if ($LASTEXITCODE -eq 0) { Write-Host $log; throw 'test-real-clipboard.ps1 passed with findstr.exe as the fixer' }
          if ($log -notmatch 'FAIL \[crlf-cjk-fixed\]') { Write-Host $log; throw 'expected crlf-cjk-fixed to fail' }
          Write-Host 'negative control failed as expected'
          $global:LASTEXITCODE = 0

  macos:
    name: macOS (pbcopy/pbpaste)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build markdown-fixer
        run: cargo build -p markdown-fixer-cli --locked
      - name: Script logic with fake pbcopy/pbpaste/osascript
        env:
          MARKDOWN_FIXER_TEST_BIN: ${{ github.workspace }}/target/debug/markdown-fixer
        run: examples/macos/test-markdown-fix-paste.sh
      - name: Paste JXA (wait for modifiers, then Cmd+V) with mocked CoreGraphics
        run: node --test examples/macos/test-paste-jxa.mjs
      - name: Real clipboard (pbcopy/pbpaste/NSPasteboard)
        timeout-minutes: 5
        env:
          MARKDOWN_FIXER_BIN: ${{ github.workspace }}/target/debug/markdown-fixer
        run: examples/macos/test-real-clipboard.sh
      - name: Negative control (test must catch a fixer that changes nothing)
        timeout-minutes: 5
        run: |
          log="$RUNNER_TEMP/negative-macos.log"
          if MARKDOWN_FIXER_BIN=/bin/cat examples/macos/test-real-clipboard.sh >"$log" 2>&1; then
            cat "$log"; echo "test-real-clipboard.sh passed with /bin/cat as the fixer"; exit 1
          fi
          grep -F 'FAIL [cjk-fixed]' "$log"
